openapi: 3.0.3
info:
  title: E-commerce REST API
  version: 1.0.0
  description: REST API for user authentication, products, carts, checkout, and orders.
servers:
  - url: http://localhost:3000
    description: Local development server

tags:
  - name: Authentication
  - name: Users
  - name: Products
  - name: Cart
  - name: Orders

paths:
  /register:
    post:
      tags: [Authentication]
      summary: Register a user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: User registered and signed in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticatedUserResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: Username or email already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '500':
          $ref: '#/components/responses/ServerError'

  /login:
    post:
      tags: [Authentication]
      summary: Log in a user
      description: Creates an authenticated session cookie on successful login.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticatedUserResponse'
        '401':
          description: Invalid username or password
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'

  /logout:
    delete:
      tags: [Authentication]
      summary: Log out the current user
      security:
        - sessionAuth: []
      responses:
        '204':
          description: Session destroyed successfully
        '401':
          $ref: '#/components/responses/Unauthorized'

  /users:
    get:
      tags: [Users]
      summary: Get the current user
      security:
        - sessionAuth: []
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
    put:
      tags: [Users]
      summary: Update the current user
      security:
        - sessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
      responses:
        '200':
          description: User updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'

  /products:
    get:
      tags: [Products]
      summary: List products
      parameters:
        - name: category
          in: query
          required: false
          description: Category ID used to filter products.
          schema:
            type: integer
      responses:
        '200':
          description: Product list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Product'

  /products/{id}:
    get:
      tags: [Products]
      summary: Get a product
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Product
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '404':
          description: Product not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'

  /cart:
    get:
      tags: [Cart]
      summary: Get the current user's cart
      security:
        - sessionAuth: []
      responses:
        '200':
          description: Cart and its items
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Cart]
      summary: Add a product to the cart
      description: Adds quantity to an existing cart item when the product is already present.
      security:
        - sessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddCartItemRequest'
      responses:
        '201':
          description: Cart item created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartItem'
        '200':
          description: Existing cart item quantity increased
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartItem'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Product not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'

  /cart/{id}:
    put:
      tags: [Cart]
      summary: Set a cart item quantity
      security:
        - sessionAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCartItemRequest'
      responses:
        '200':
          description: Cart item updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartItem'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Cart item not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
    delete:
      tags: [Cart]
      summary: Delete a cart item
      security:
        - sessionAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '204':
          description: Cart item deleted
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Cart item not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'

  /cart/checkout:
    post:
      tags: [Cart]
      summary: Checkout the entire cart
      description: Atomically creates an order and order items from the cart, then clears the cart. The transaction rolls back if any step fails.
      security:
        - sessionAuth: []
      responses:
        '201':
          description: Checkout completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckoutResponse'
        '400':
          description: Cart is empty
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Cart not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'

  /orders:
    get:
      tags: [Orders]
      summary: List the current user's orders
      security:
        - sessionAuth: []
      responses:
        '200':
          description: User orders and their items
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrdersResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /orders/{id}:
    get:
      tags: [Orders]
      summary: Get one of the current user's orders
      security:
        - sessionAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Order and its items
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Order not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'

components:
  securitySchemes:
    sessionAuth:
      type: apiKey
      in: cookie
      name: connect.sid
      description: Express session cookie created by login or registration.

  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1

  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MessageResponse'
    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MessageResponse'
    ServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MessageResponse'

  schemas:
    MessageResponse:
      type: object
      required: [message]
      properties:
        message:
          type: string

    User:
      type: object
      required: [id, username, email]
      properties:
        id:
          type: integer
          example: 1
        username:
          type: string
          example: testuser
        email:
          type: string
          format: email
          example: test@example.com

    RegisterRequest:
      type: object
      required: [username, email, password]
      properties:
        username:
          type: string
          example: testuser
        email:
          type: string
          format: email
          example: test@example.com
        password:
          type: string
          format: password
          example: password123

    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          example: testuser
        password:
          type: string
          format: password
          example: password123

    UpdateUserRequest:
      type: object
      required: [username, email]
      properties:
        username:
          type: string
          example: updateduser
        email:
          type: string
          format: email
          example: updated@example.com
        password:
          type: string
          format: password
          example: newpassword123

    AuthenticatedUserResponse:
      type: object
      required: [message, user]
      properties:
        message:
          type: string
        user:
          $ref: '#/components/schemas/User'

    Product:
      type: object
      required: [id, name, price]
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: Wireless Keyboard
        description:
          type: string
          nullable: true
          example: Compact mechanical keyboard with Bluetooth connectivity.
        price:
          type: number
          format: double
          example: 79.99
        created_at:
          type: string
          format: date-time

    CartItem:
      type: object
      required: [id, product_id, quantity]
      properties:
        id:
          type: integer
          example: 1
        cart_id:
          type: integer
          example: 1
        product_id:
          type: integer
          example: 1
        name:
          type: string
          example: Wireless Keyboard
        price:
          type: number
          format: double
          example: 79.99
        quantity:
          type: integer
          minimum: 1
          example: 2
        created_at:
          type: string
          format: date-time

    CartResponse:
      type: object
      required: [cartId, items]
      properties:
        cartId:
          type: integer
          example: 1
        items:
          type: array
          items:
            $ref: '#/components/schemas/CartItem'

    AddCartItemRequest:
      type: object
      required: [productId, quantity]
      properties:
        productId:
          type: integer
          minimum: 1
          example: 1
        quantity:
          type: integer
          minimum: 1
          example: 2

    UpdateCartItemRequest:
      type: object
      required: [quantity]
      properties:
        quantity:
          type: integer
          minimum: 1
          example: 3

    OrderItem:
      type: object
      required: [id, order_id, product_id, quantity, price]
      properties:
        id:
          type: integer
          example: 1
        order_id:
          type: integer
          example: 1
        product_id:
          type: integer
          example: 1
        quantity:
          type: integer
          minimum: 1
          example: 2
        price:
          type: number
          format: double
          example: 79.99

    Order:
      type: object
      required: [id, user_id, total, created_at]
      properties:
        id:
          type: integer
          example: 1
        user_id:
          type: integer
          example: 1
        total:
          type: number
          format: double
          example: 129.94
        created_at:
          type: string
          format: date-time

    CheckoutResponse:
      type: object
      required: [message, order, items]
      properties:
        message:
          type: string
          example: Checkout completed successfully
        order:
          $ref: '#/components/schemas/Order'
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItem'

    OrdersResponse:
      type: object
      required: [orders]
      properties:
        orders:
          type: array
          items:
            $ref: '#/components/schemas/OrderListItem'

    OrderListItem:
      type: object
      required: [id, created_at, product_id, quantity]
      properties:
        id:
          type: integer
          example: 1
        created_at:
          type: string
          format: date-time
        product_id:
          type: integer
          example: 1
        quantity:
          type: integer
          example: 2

    OrderResponse:
      type: object
      required: [order]
      properties:
        order:
          type: array
          items:
            $ref: '#/components/schemas/OrderListItem'
